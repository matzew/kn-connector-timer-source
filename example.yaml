apiVersion: samples.knative.dev/v1alpha1
kind: KameletSource
metadata:
  name: kamelet-source
  namespace: knative-samples
spec:
  type: "timer"
  properties:
    message: "Hello receiver 2"
    period: "5s"
    foo: bar # Causes no harm :-)
  sink:
    ref:
      apiVersion: eventing.knative.dev/v1
      kind: Broker
      name: default-2
